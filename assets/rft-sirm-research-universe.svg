<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">RFT-SIRM research universe</title><desc id="desc">A single animated mathematical artwork: the exact fourth-moment SU(2) trace identity, normalized limit, Schur spectral enclosure, and finite-level precision certificates.</desc><defs>
