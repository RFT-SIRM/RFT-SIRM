<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RFT-SIRM research orbit</title>
  <desc id="desc">Animated research dashboard showing the exact fourth-moment identity, a recursive Sierpinski graph, the Schur spectral limit, and finite-level precision certificates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0c1628"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d7ee"/>
      <stop offset="1" stop-color="#43a8ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16273c" stroke-width="0.7"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill:#8295ad; }
      .white { fill:#e6edf7; }
      .cyan { fill:#42d9ee; }
      .violet { fill:#b39aff; }
      .amber { fill:#ffbe72; }
      .green { fill:#66e0b0; }
      .panel { fill:#0b1728; stroke:#263e59; stroke-width:1.2; }
      .rule { stroke:#29415b; stroke-width:1; }
      .small { font-size:11px; letter-spacing:1.1px; }
      .body { font-size:14px; }
      .label { font-size:12px; letter-spacing:1.4px; font-weight:700; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="518" rx="18" fill="url(#bg)" stroke="#2b4664" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="516" rx="17" fill="url(#grid)" opacity=".44"/>
  <text x="30" y="43" class="mono white" font-size="27" font-weight="800" letter-spacing="1">RFT-SIRM</text>
  <text x="190" y="41" class="mono muted" font-size="12" letter-spacing="1.5">RESONANT FIELD THEORY  ×  SYNTHETIC INTELLIGENCE REASONING MODEL</text>
  <circle cx="1065" cy="35" r="5" fill="#66e0b0">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="40" class="mono green" font-size="11" letter-spacing="1">RESEARCH SYSTEM</text>
  <line x1="28" y1="59" x2="1172" y2="59" class="rule"/>

  <!-- Left: exact H4 identity -->
  <rect x="28" y="80" width="334" height="350" rx="13" class="panel"/>
  <rect x="28" y="80" width="334" height="4" rx="2" fill="url(#cyan)"/>
  <text x="48" y="112" class="mono cyan label">H⁴ TRACE IDENTITY</text>
  <line x1="46" y1="128" x2="344" y2="128" class="rule"/>
  <text x="48" y="157" class="mono muted small">NON-COMMUTING  vs  COMMUTING CONTROL</text>
  <text x="48" y="197" class="mono white" font-size="20" font-weight="700">Δₘ(H⁴, θ) =</text>
  <text x="48" y="232" class="mono cyan" font-size="22" font-weight="700">−16 (3ᵐ⁻¹ + 1)</text>
  <text x="48" y="263" class="mono cyan" font-size="22" font-weight="700">× sin²(θ / 2)</text>
  <rect x="46" y="283" width="298" height="37" rx="7" fill="#0d2934" stroke="#1a8191"/>
  <text x="60" y="306" class="mono green" font-size="12" font-weight="700">LEAN 4  ·  ALL m ≥ 1  ·  ALL REAL θ</text>
  <text x="48" y="349" class="mono muted small">NORMALIZED LIMIT</text>
  <text x="48" y="377" class="mono white" font-size="15">I∞(θ) = −16/9 · sin²(θ/2)</text>
  <text x="48" y="404" class="mono amber" font-size="14">At θ = π/2:  −8/9</text>

  <!-- Center: graph and animated pulse -->
  <rect x="382" y="80" width="436" height="350" rx="13" class="panel"/>
  <text x="405" y="112" class="mono white label">SIERPINSKI GRAPH  /  SU(2)</text>
  <circle cx="650" cy="107" r="4" fill="#42d9ee"/><text x="661" y="111" class="mono muted small">X</text>
  <circle cx="704" cy="107" r="4" fill="#b39aff"/><text x="715" y="111" class="mono muted small">Y</text>
  <circle cx="757" cy="107" r="4" fill="#ffbe72"/><text x="768" y="111" class="mono muted small">Z</text>

  <!-- Sierpinski-like recursive graph edges -->
  <g fill="none" stroke-width="2" stroke-linecap="round" opacity=".95">
    <path d="M600 140 L462 378 L738 378 Z" stroke="#7894b4"/>
    <path d="M600 140 L531 259 L669 259 Z" stroke="#42d9ee"/>
    <path d="M531 259 L462 378 L600 378 Z" stroke="#b39aff"/>
    <path d="M669 259 L600 378 L738 378 Z" stroke="#ffbe72"/>
    <path d="M531 259 L600 378 M669 259 L600 378" stroke="#314e6d" stroke-dasharray="4 5"/>
    <path d="M600 140 L565 200 L634 200 Z" stroke="#42d9ee" opacity=".8"/>
    <path d="M565 200 L531 259 L600 259 Z" stroke="#b39aff" opacity=".8"/>
    <path d="M634 200 L600 259 L669 259 Z" stroke="#ffbe72" opacity=".8"/>
    <path d="M462 378 L496 319 L531 378 Z M531 378 L565 319 L600 378 Z" stroke="#42d9ee" opacity=".8"/>
    <path d="M600 378 L634 319 L669 378 Z M669 378 L704 319 L738 378 Z" stroke="#b39aff" opacity=".8"/>
    <path d="M496 319 L531 259 L565 319 Z M634 319 L669 259 L704 319 Z" stroke="#ffbe72" opacity=".8"/>
  </g>
  <g fill="#07111f" stroke-width="2">
    <circle cx="600" cy="140" r="6" stroke="#42d9ee"/>
    <circle cx="462" cy="378" r="6" stroke="#b39aff"/>
    <circle cx="738" cy="378" r="6" stroke="#ffbe72"/>
    <circle cx="531" cy="259" r="4" stroke="#42d9ee"/>
    <circle cx="669" cy="259" r="4" stroke="#b39aff"/>
    <circle cx="600" cy="378" r="4" stroke="#ffbe72"/>
  </g>
  <path d="M600 140 L531 259 L462 378 L600 378 L669 259 L738 378 L600 140" fill="none" stroke="#47d6eb" stroke-width="1.2" stroke-dasharray="3 9" opacity=".25"/>
  <circle r="6" fill="#66e0b0" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M600 140 L531 259 L462 378 L600 378 L669 259 L738 378 L600 140"/>
    <animate attributeName="r" values="4;7;4" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="284" r="12" fill="none" stroke="#42d9ee" opacity=".8">
    <animate attributeName="r" values="8;25;8" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="410" class="mono muted small" text-anchor="middle">RECURSIVE GLUING  ·  X / Y / Z AXES</text>

  <!-- Right: spectral precision -->
  <rect x="838" y="80" width="334" height="350" rx="13" class="panel"/>
  <rect x="838" y="80" width="334" height="4" rx="2" fill="url(#violet)"/>
  <text x="858" y="112" class="mono violet label">SCHUR SPECTRAL LIMIT</text>
  <line x1="856" y1="128" x2="1154" y2="128" class="rule"/>
  <text x="858" y="154" class="mono muted small">LEAN CONVERGENCE THEOREM</text>
  <text x="858" y="189" class="mono white" font-size="20" font-weight="700">λ∞ ∈ [L, U]</text>
  <text x="858" y="214" class="mono green" font-size="12">exact rational width: 2 × 10⁻³⁶</text>
  <line x1="856" y1="233" x2="1154" y2="233" class="rule"/>
  <text x="858" y="257" class="mono muted small">FINITE-LEVEL NUMERICS</text>
  <text x="858" y="282" class="mono violet" font-size="13">λ₉ ≈ 1.30912892028081342189…</text>
  <text x="858" y="307" class="mono white" font-size="12">δ₁₂ ≈ 1.1587 × 10⁻¹¹⁶³</text>
  <line x1="856" y1="325" x2="1154" y2="325" class="rule"/>
  <text x="858" y="349" class="mono muted small">FINITE-LEVEL CERTIFICATES</text>
  <text x="858" y="374" class="mono amber" font-size="13">2,450 digits · radius 10⁻²³⁹⁰</text>
  <text x="858" y="398" class="mono amber" font-size="13">10,000 digits · radius 10⁻⁹⁴⁰⁰</text>
  <text x="858" y="416" class="mono muted" font-size="9.5">bounded levels / transitions · not λ∞ digits</text>

  <!-- Footer -->
  <rect x="28" y="449" width="1144" height="43" rx="9" fill="#0b1728" stroke="#263e59"/>
  <text x="48" y="476" class="mono white" font-size="16" font-weight="600">It doesn't matter who I am. What matters is what my plan is.</text>
  <text x="1138" y="473" class="mono cyan" font-size="10" text-anchor="end">RFT-SIRM  /  INVARIANT-LED RESEARCH</text>
  <rect x="30" y="506" width="1140" height="3" rx="1.5" fill="#15283d"/>
  <rect x="30" y="506" width="1140" height="3" rx="1.5" fill="url(#cyan)">
    <animate attributeName="width" values="0;1140;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>